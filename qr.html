<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR De wan chef</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E8572A 0%, #C41E3A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .qr-card {
            background: white;
            border-radius: 24px;
            padding: 2rem 1.5rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 4px solid #E8572A;
            position: relative;
        }
        
        .qr-card::before,
        .qr-card::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #C41E3A;
            opacity: 0.3;
        }
        .qr-card::before {
            top: 8px; left: 8px;
            border-right: none; border-bottom: none;
            border-radius: 15px 0 0 0;
        }
        .qr-card::after {
            bottom: 8px; right: 8px;
            border-left: none; border-top: none;
            border-radius: 0 0 15px 0;
        }
        
        .qr-card img.logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 0.8rem;
            border: 3px solid #E8572A;
        }
        .qr-card h1 {
            color: #E8572A;
            font-size: 1.6rem;
            margin-bottom: 0.2rem;
        }
        .qr-card .tagline {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            font-style: italic;
        }
        
        #qrcode-container {
            display: flex;
            justify-content: center;
            margin: 1.2rem 0;
            padding: 1.5rem;
            background: #FFF5E6;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 15px,
                    rgba(232, 87, 42, 0.08) 15px,
                    rgba(232, 87, 42, 0.08) 30px
                );
            border-radius: 16px;
            border: 3px dashed #E8572A;
        }
        #qrcode img {
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        
        .cta-text {
            color: #1a1a1a;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1rem;
            line-height: 1.4;
        }
        .cta-text span {
            display: block;
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .btn {
            flex: 1;
            padding: 0.9rem;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-download {
            background: linear-gradient(135deg, #E8572A 0%, #C41E3A 100%);
            color: white;
        }
        .btn-print {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
        }
        
        @media print {
            .btn-group { display: none; }
            body { background: white; }
            .qr-card { box-shadow: none; border: 3px solid #E8572A; }
        }
    </style>
</head>
<body>
    <div class="qr-card" id="qr-card">
        <img src="assets/logo.png" alt="De wan chef" class="logo" crossorigin="anonymous">
        <h1>De wan chef</h1>
        <p class="tagline">Sabor chino auténtico y al wok</p>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>
        
        <p class="cta-text">
             Escanea y pide desde tu celular
            <span>Menú digital • Precios en USD y Bs • Pedido directo a WhatsApp</span>
        </p>
        
        <div class="btn-group">
            <button class="btn btn-download" onclick="downloadQR()">📥 Descargar PNG</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
        </div>
    </div>

    <script>
        const siteURL = 'https://dewanchef.netlify.app/';
        
        new QRCode(document.getElementById('qrcode'), {
            text: siteURL,
            width: 200,
            height: 200,
            colorDark: '#C41E3A',
            colorLight: '#FFF5E6',
            correctLevel: QRCode.CorrectLevel.H
        });

        function downloadQR() {
    const qrCard = document.getElementById('qr-card');
    const btnGroup = document.querySelector('.btn-group');
    const btn = event.target;
    const originalText = btn.textContent;
    
    // Ocultar botones antes de capturar
    btnGroup.style.display = 'none';
    btn.textContent = '⏳ Generando...';
    btn.disabled = true;
    
    // Esperar un momento para que el DOM se actualice
    setTimeout(() => {
        html2canvas(qrCard, {
            scale: 1.5,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff',
            logging: false,
            width: qrCard.offsetWidth,
            height: qrCard.offsetHeight
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'QR-De-wan-chef.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // Restaurar botones
            btnGroup.style.display = 'flex';
            btn.textContent = originalText;
            btn.disabled = false;
        }).catch(err => {
            console.error(err);
            btnGroup.style.display = 'flex';
            btn.textContent = originalText;
            btn.disabled = false;
            alert('Error al generar. Intenta de nuevo.');
        });
    }, 100);
}
    </script>
</body>
</html>
